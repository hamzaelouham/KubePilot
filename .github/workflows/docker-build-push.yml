name: Build and push Docker images

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: >
          Image tag to apply (for example feature-header-theme or v1.2.0).
          Leave empty to use the branch name (slashes are converted to dashes).
        required: false
        default: ""
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "backend/**"
      - "k8s-ui/**"
      - ".github/workflows/docker-build-push.yml"

permissions:
  contents: read

env:
  DOCKERHUB_NAMESPACE: hamzaelouham

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.head_ref || github.ref_name }}"
          fi
          TAG="${TAG//\//-}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Resolved tag: ${TAG}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/kubepilot-backend:${{ steps.tag.outputs.tag }}
            ${{ env.DOCKERHUB_NAMESPACE }}/kubepilot-backend:latest

      - name: Build and push UI
        uses: docker/build-push-action@v6
        with:
          context: ./k8s-ui
          file: ./k8s-ui/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/kubepilot-ui:${{ steps.tag.outputs.tag }}
            ${{ env.DOCKERHUB_NAMESPACE }}/kubepilot-ui:latest
