name: Build and push Docker images

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: >
          Image tag to apply (for example feature-header-theme or v1.2.0).
          Leave empty to use the branch name (slashes are converted to dashes).
        required: false
        default: ""
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "backend/**"
      - "k8s-ui/**"
      - ".github/workflows/docker-build-push.yml"

permissions:
  contents: read

env:
  DOCKERHUB_NAMESPACE: hamzaelouham

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          TAG="$REQUESTED_TAG"
          if [ -z "$TAG" ]; then
            TAG="${BRANCH_NAME//\//-}-${COMMIT_SHA:0:7}"
          fi
          if [[ "$TAG" == latest || ! "$TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image tag" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "backend=${DOCKERHUB_NAMESPACE}/kubepilot-backend:${TAG}" >> "${GITHUB_OUTPUT}"
          echo "ui=${DOCKERHUB_NAMESPACE}/kubepilot-ui:${TAG}" >> "${GITHUB_OUTPUT}"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$BRANCH_NAME" == master && "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "backend_latest=${DOCKERHUB_NAMESPACE}/kubepilot-backend:latest" >> "${GITHUB_OUTPUT}"
            echo "ui_latest=${DOCKERHUB_NAMESPACE}/kubepilot-ui:latest" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.tag.outputs.backend }}
            ${{ steps.tag.outputs.backend_latest }}

      - name: Build and push UI
        uses: docker/build-push-action@v6
        with:
          context: ./k8s-ui
          file: ./k8s-ui/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.tag.outputs.ui }}
            ${{ steps.tag.outputs.ui_latest }}
