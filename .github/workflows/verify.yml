name: Verify

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  backend-tests:
    name: Full backend regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run full backend suite
        working-directory: backend
        run: python -m pytest

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: k8s-ui/yarn.lock

      - name: Install frontend dependencies
        working-directory: k8s-ui
        run: yarn install --frozen-lockfile

      - name: Run Assistant tests
        working-directory: k8s-ui
        run: yarn test:assistant

      - name: Build frontend
        working-directory: k8s-ui
        run: yarn verify
