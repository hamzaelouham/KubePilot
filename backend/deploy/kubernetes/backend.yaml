apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kubepilot
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: kubepilot-api
      containers:
        - name: backend
          image: hamzaelouham/kubepilot-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: kubepilot-config
          env:
            - name: KUBEPILOT_HOST_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KUBEPILOT_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: kubepilot-secret
                  key: KUBEPILOT_AUTH_SECRET
            - name: KUBEPILOT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kubepilot-secret
                  key: KUBEPILOT_DATABASE_URL
            - name: KUBEPILOT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubepilot-secret
                  key: KUBEPILOT_ADMIN_PASSWORD
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: kubepilot
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
