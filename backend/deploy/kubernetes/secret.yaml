apiVersion: v1
kind: Secret
metadata:
  name: kubepilot-secret
  namespace: kubepilot
type: Opaque
# Local Minikube development placeholder values (matching the compose dev defaults).
# Override before any non-local deployment. Autor-shared auth secret is >= 32 chars.
stringData:
  KUBEPILOT_AUTH_SECRET: local-minikube-dev-secret-0123456789abcdef
  KUBEPILOT_ADMIN_PASSWORD: kubepilot
  POSTGRES_USER: kubepilot
  POSTGRES_PASSWORD: change-me
  POSTGRES_DB: kubepilot
  KUBEPILOT_DATABASE_URL: postgresql+psycopg://kubepilot:change-me@db:5432/kubepilot
