services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KUBEPILOT_DB_USER:-kubepilot}
      POSTGRES_PASSWORD: ${KUBEPILOT_DB_PASSWORD:-change-me}
      POSTGRES_DB: ${KUBEPILOT_DB_NAME:-kubepilot}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KUBEPILOT_DB_USER:-kubepilot} -d ${KUBEPILOT_DB_NAME:-kubepilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    image: kubepilot-backend
    restart: unless-stopped
    environment:
      KUBEPILOT_AUTH_SECRET: ${KUBEPILOT_AUTH_SECRET:?KUBEPILOT_AUTH_SECRET is required (at least 32 chars)}
      KUBEPILOT_DATABASE_URL: postgresql+psycopg://${KUBEPILOT_DB_USER:-kubepilot}:${KUBEPILOT_DB_PASSWORD:-change-me}@db:5432/${KUBEPILOT_DB_NAME:-kubepilot}
      KUBEPILOT_CLUSTER_NAME: ${KUBEPILOT_CLUSTER_NAME:-primary}
      KUBEPILOT_SERVICE_NAME: ${KUBEPILOT_SERVICE_NAME:-kubepilot-api}
      KUBEPILOT_ADMIN_EMAIL: ${KUBEPILOT_ADMIN_EMAIL:-ops@kubepilot.io}
      KUBEPILOT_ADMIN_PASSWORD: ${KUBEPILOT_ADMIN_PASSWORD:-kubepilot}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./k8s-ui
    image: kubepilot-ui
    restart: unless-stopped
    environment:
      KUBEPILOT_BACKEND_URL: ${KUBEPILOT_BACKEND_URL:-http://backend:8000}
      KUBEPILOT_CLUSTER_NAME: ${KUBEPILOT_CLUSTER_NAME:-primary}
      KUBEPILOT_AUTH_SECRET: ${KUBEPILOT_AUTH_SECRET:?KUBEPILOT_AUTH_SECRET is required (at least 32 chars)}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  db-data:
